version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: plantir_db
    environment:
      POSTGRES_USER: plantir_admin
      POSTGRES_PASSWORD: plantir_secret_password
      POSTGRES_DB: plantir_blr_db
    ports:
      - "5433:5433"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantir_admin -d plantir_blr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plantir_realtime
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgis_data:
  redis_data:
