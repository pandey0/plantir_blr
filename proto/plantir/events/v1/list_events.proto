syntax = "proto3";

package plantir.events.v1;

import "plantir/events/v1/event.proto";

message ListEventsRequest {
  optional string cursor = 1;
  int32 limit = 2;  // 1-100, default 50 — range enforced by Zod at the handler, not by proto
}

message ListEventsResponse {
  repeated Event events = 1;
  optional string next_cursor = 2;
}
