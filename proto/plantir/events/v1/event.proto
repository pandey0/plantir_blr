syntax = "proto3";

package plantir.events.v1;

// Mirrors packages/database/prisma/schema.prisma's Event/EventCategory/EventStatus.
//
// Deliberately deviates from proto3's zero-value-as-UNSPECIFIED convention: this
// project uses these only as JSON-over-HTTP types (ts-proto `stringEnums`), never
// binary wire encoding, so enum values are the literal REST/Prisma strings with no
// translation layer to keep in sync by hand. See docs/architecture/TECH_STACK.md
// decision log if this ever needs reconsidering.

enum EventCategory {
  POTHOLE = 0;
  GARBAGE = 1;
  WATER_LOGGING = 2;
  TRAFFIC_INCIDENT = 3;
  UNAUTHORIZED_CONSTRUCTION = 4;
  STREET_LIGHT_FAILURE = 5;
  OTHER = 6;
}

enum EventStatus {
  REPORTED = 0;
  VERIFIED = 1;
  ESCALATED = 2;
  IN_PROGRESS = 3;
  RESOLVED = 4;
  FRAUD = 5;
}

message Event {
  string id = 1;
  EventCategory category = 2;
  EventStatus status = 3;
  int32 confidence_score = 4;
  string created_at = 5;            // ISO 8601
  string updated_at = 6;            // ISO 8601
  optional string resolved_at = 7;  // ISO 8601
}
